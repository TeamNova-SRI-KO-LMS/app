# CI pipeline for the SRI-KO LMS monorepo (SENG 34213 §7.2).
#
# Every push and pull request runs lint, build and the unit/integration suites with
# coverage gates. Pushes and pull requests to develop and main also run the
# end-to-end journeys and the dependency scan. Deployment is handled by the Vercel
# Git integration, not by this workflow: every push gets a preview deployment and
# pushes to the production branch are deployed to production. Protect that branch so
# only pull requests with a green pipeline can be merged (see VERCEL_DEPLOYMENT.md).

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint (new and modified files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Lint files changed by this push or pull request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.ref }}" != "refs/heads/develop" ] && [ "${{ github.ref }}" != "refs/heads/main" ] \
            && git rev-parse -q --verify origin/develop > /dev/null; then
            # A feature branch answers for its own changes, not for develop's files merged into it
            BASE="$(git merge-base origin/develop HEAD)"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          CHANGED="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.js' '*.jsx')"
          STATUS=0
          for PACKAGE in backend frontend; do
            FILES="$(printf '%s\n' "$CHANGED" | grep "^$PACKAGE/" | sed "s#^$PACKAGE/##" || true)"
            if [ -n "$FILES" ]; then
              echo "Linting $(printf '%s\n' "$FILES" | wc -l) changed file(s) in $PACKAGE"
              (cd "$PACKAGE" && printf '%s\n' "$FILES" | xargs npx eslint --no-warn-ignored) || STATUS=1
            fi
          done
          exit $STATUS
      - name: Report the full lint baseline (informational)
        if: always()
        continue-on-error: true
        run: |
          (cd backend && npx eslint . --format=stylish | tail -n 3) || true
          (cd frontend && npx eslint . --format=stylish | tail -n 3) || true

  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.example.invalid/api
          VITE_ENABLE_SOCKET: 'false'

  backend-tests:
    name: Backend unit, integration and security tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Run Jest with coverage thresholds (80% lines and statements)
        run: npm run test:ci
        working-directory: backend
        env:
          TEST_MONGO_URI: mongodb://localhost:27017/
      - name: Run the node:test suites in backend/test
        run: npm run test:node
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 30

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run Vitest with coverage thresholds
        run: npm run test:ci
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

  e2e:
    name: End-to-end journeys
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-tests, build]
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/sriko_e2e
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      FRONTEND_URL: http://127.0.0.1:4174
      PORT: '5055'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Seed demonstration data
        run: npm run seed:demo
        working-directory: backend
      - name: Start the API
        run: nohup node server.js > ../api.log 2>&1 &
        working-directory: backend
      - name: Build and serve the frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:5055/api
          VITE_ENABLE_SOCKET: 'true'
        run: |
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 4174 --strictPort > ../web.log 2>&1 &
      - name: Wait for both servers
        run: |
          for url in http://127.0.0.1:5055/api/health http://127.0.0.1:4174/; do
            for attempt in $(seq 1 30); do curl -sf "$url" > /dev/null && break; sleep 2; done
          done
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            api.log
            web.log
          retention-days: 30

  security:
    name: Dependency vulnerability scan
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Production dependencies must have no high or critical advisories
        run: |
          (cd backend && npm audit --omit=dev --audit-level=high)
          (cd frontend && npm audit --omit=dev --audit-level=high)
      - name: Report advisories in development tooling (informational)
        continue-on-error: true
        run: |
          (cd backend && npm audit --audit-level=high) || true
          (cd frontend && npm audit --audit-level=high) || true

  pipeline:
    name: Pipeline result
    if: always()
    needs: [lint, build, backend-tests, frontend-tests, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"' && exit 1 || exit 0
